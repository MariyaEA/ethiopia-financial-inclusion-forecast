[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopia-financial-inclusion-forecast"
version = "0.2.0"
description = "A transparent and reliability-focused financial inclusion forecasting system for Ethiopia."
requires-python = ">=3.10"
authors = [{ name = "Mariamawit Alemu" }]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "streamlit==1.40.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=fi_forecast --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"scripts/build_enriched_data.py" = ["E402"]
"scripts/run_quality_report.py" = ["E402"]
